name: Verificaciones .NET

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Seleccionar el SDK instalado
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --force
      - name: Restaurar
        run: dotnet restore Verification/Verification.csproj
      - name: Compilar
        run: dotnet build Verification/Verification.csproj -c Release --no-restore
      - name: Verificar sin SQL ni secretos
        run: dotnet run --project Verification/Verification.csproj -c Release --no-build
